<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sherlock AI Benchmark</title><style>*{box-sizing:border-box}
:root{color-scheme:light;--page:#f4f7fb;--surface:#fff;--surface-soft:#f7f9fc;--ink:#1c2b43;--muted:#5f6e84;--border:#dfe6f0;--blue:#315fdf;--blue-soft:#edf3ff}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:18px}
main{max-width:850px;margin:auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 5px 18px rgba(32,52,88,.045)}
h1{font-size:clamp(21px,4vw,27px);letter-spacing:-.45px;margin:0 0 7px;color:#172942}
h2{color:#172942}
p{color:var(--muted);margin:7px 0 12px}
.progress{height:9px;background:#e8edf5;border-radius:9px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#4778e7,#36a47c);width:0;border-radius:9px;transition:width .2s ease}
button{border:1px solid transparent;border-radius:10px;padding:11px 15px;background:var(--blue);color:#fff;font:700 13px/1.2 system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:42px;margin:5px 5px 5px 0;cursor:pointer}
button:hover{filter:brightness(.96)}
button:focus-visible,input:focus-visible{outline:3px solid rgba(49,95,223,.24);outline-offset:2px}
.secondary{background:var(--blue-soft);border-color:#d5e0f5;color:#3158b5}
label{display:flex;align-items:flex-start;gap:9px;padding:10px 11px;margin:6px 0;background:var(--surface-soft);border:1px solid #e5eaf2;border-radius:10px;color:#293a54;cursor:pointer}
label:hover{border-color:#c7d7f4;background:#f2f6ff}
label:focus-within{border-color:#7da1ef;box-shadow:0 0 0 2px rgba(49,95,223,.12)}
input[type=radio]{flex:0 0 auto;margin:3px 0 0;accent-color:var(--blue)}
.category{color:#3158b5;font-weight:800;font-size:12px;letter-spacing:.25px}
textarea{display:block;width:100%;min-height:160px;background:#fff;color:#24354e;padding:12px;border:1px solid #d5deea;border-radius:11px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}textarea::placeholder{color:#66758b;opacity:1}
@media(max-width:560px){body{padding:10px}.card{padding:14px;border-radius:13px}button{min-height:44px;padding:11px 13px}}</style></head><body><main><section class="card"><h1>🧠 Sherlock AI Benchmark v1.0</h1><p>50 unique questions · five categories · ten each. Independent evaluation; no model training or checkpoint changes.</p><div class="progress"><div class="fill" id="fill"></div></div><p id="progress">0 of 50 answered</p></section><div id="quiz"></div><section class="card"><button onclick="score()">Score</button><button class="secondary" onclick="copy()">Copy report</button><button class="secondary" onclick="reset()">Reset</button><div id="result"></div><textarea id="report" readonly placeholder="Report appears here"></textarea></section></main><script>const Q=[{"c":"Logic","q":"All Bloops are Razzies; all Razzies Lazzies. Bloops Lazzies?","o":["Yes","No","Cannot tell","Only some"],"a":0},{"c":"Logic","q":"A older B, B older C. Youngest?","o":["A","B","C","Unknown"],"a":2},{"c":"Logic","q":"No cats are dogs. Can a dog be cat?","o":["Yes","No","Sometimes","Unknown"],"a":1},{"c":"Logic","q":"Sam left of Lee; Lee left of Jo. Rightmost?","o":["Sam","Lee","Jo","Unknown"],"a":2},{"c":"Logic","q":"Only red or blue balls; one not red. Colour?","o":["Red","Blue","Green","Unknown"],"a":1},{"c":"Logic","q":"All keys open doors. This is a key. It...","o":["Opens a door","Is a door","Is broken","Unknown"],"a":0},{"c":"Logic","q":"Contradicts every bird has wings?","o":["Bird has wings","Bird has no wings","Bird flies","Bird is animal"],"a":1},{"c":"Logic","q":"Monday plus 10 days?","o":["Wednesday","Thursday","Friday","Saturday"],"a":1},{"c":"Logic","q":"C taller than A, A taller B. Tallest?","o":["A","B","C","Unknown"],"a":2},{"c":"Logic","q":"Some artists teachers. Must all teachers artists?","o":["Yes","No","Only some","Unknown"],"a":1},{"c":"Maths","q":"15% of 200?","o":["15","20","30","45"],"a":2},{"c":"Maths","q":"3x+5=20. x?","o":["3","5","6","15"],"a":1},{"c":"Maths","q":"7×8?","o":["48","54","56","64"],"a":2},{"c":"Maths","q":"£12 minus 25%?","o":["£3","£8","£9","£10"],"a":2},{"c":"Maths","q":"Mean 4,6,8?","o":["5","6","7","8"],"a":1},{"c":"Maths","q":"144÷12?","o":["10","11","12","14"],"a":2},{"c":"Maths","q":"9 squared?","o":["18","72","81","99"],"a":2},{"c":"Maths","q":"2/5 percentage?","o":["20%","25%","40%","50%"],"a":2},{"c":"Maths","q":"Rectangle 6 by 7 area?","o":["13","36","42","49"],"a":2},{"c":"Maths","q":"2x=18?","o":["6","8","9","12"],"a":2},{"c":"Patterns","q":"2,4,6,8 next?","o":["9","10","12","16"],"a":1},{"c":"Patterns","q":"3,9,27 next?","o":["36","54","72","81"],"a":3},{"c":"Patterns","q":"20,17,14,11 next?","o":["7","8","9","10"],"a":1},{"c":"Patterns","q":"1,4,9,16 next?","o":["20","24","25","36"],"a":2},{"c":"Patterns","q":"2,5,3,6,4,7 next?","o":["5","6","8","9"],"a":0},{"c":"Patterns","q":"5,10,20,40 next?","o":["45","60","80","100"],"a":2},{"c":"Patterns","q":"1,1,2,3,5,8 next?","o":["10","11","12","13"],"a":3},{"c":"Patterns","q":"100,90,80,70 next?","o":["55","60","65","70"],"a":1},{"c":"Patterns","q":"7,14,21,28 next?","o":["30","32","35","42"],"a":2},{"c":"Patterns","q":"4,7,10,13 next?","o":["15","16","17","18"],"a":1},{"c":"Language","q":"Synonym brief?","o":["Loud","Short","Heavy","Bright"],"a":1},{"c":"Language","q":"Correct grammar?","o":["They was.","They were.","They is.","They be."],"a":1},{"c":"Language","q":"Question mark purpose?","o":["End question","Excitement","Separate clauses","Possession"],"a":0},{"c":"Language","q":"Metaphor?","o":["Like a star","Time is a thief","Very quickly","As cold as ice"],"a":1},{"c":"Language","q":"Antonym ancient?","o":["Old","Historic","Modern","Early"],"a":2},{"c":"Language","q":"Synonym cautious?","o":["Careless","Careful","Fast","Noisy"],"a":1},{"c":"Language","q":"Animal plural mouse?","o":["Mouses","Mices","Mouse","Mice"],"a":3},{"c":"Language","q":"Verb?","o":["Happiness","Quickly","Run","Blue"],"a":2},{"c":"Language","q":"Correct punctuation?","o":["Its raining.","It's raining.","Its' raining.","It raining."],"a":1},{"c":"Language","q":"Opposite expand?","o":["Increase","Stretch","Contract","Enlarge"],"a":2},{"c":"Knowledge","q":"Red planet?","o":["Venus","Mars","Jupiter","Mercury"],"a":1},{"c":"Knowledge","q":"Gas plants absorb?","o":["Oxygen","Nitrogen","CO2","Hydrogen"],"a":2},{"c":"Knowledge","q":"Largest ocean?","o":["Atlantic","Indian","Arctic","Pacific"],"a":3},{"c":"Knowledge","q":"Hexagon sides?","o":["5","6","7","8"],"a":1},{"c":"Knowledge","q":"Mammal?","o":["Shark","Dolphin","Trout","Octopus"],"a":1},{"c":"Knowledge","q":"Water freezes °C?","o":["0","10","32","100"],"a":0},{"c":"Knowledge","q":"Primary light colour?","o":["Yellow","Cyan","Red","Brown"],"a":2},{"c":"Knowledge","q":"Earth satellite?","o":["Mars","Moon","Sun","Venus"],"a":1},{"c":"Knowledge","q":"Blood pumping organ?","o":["Lungs","Brain","Heart","Liver"],"a":2},{"c":"Knowledge","q":"H2O?","o":["Salt","Water","Oxygen","Hydrogen"],"a":1}];const quiz=document.getElementById('quiz');Q.forEach((x,i)=>{let d=document.createElement('section');d.className='card';d.innerHTML='<div class="category">'+x.c+' · '+(i+1)+'</div><p>'+x.q+'</p>'+x.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+o+'</label>').join('');quiz.append(d)});quiz.addEventListener('change',prog);function prog(){let n=Q.filter((x,i)=>document.querySelector('input[name=q'+i+']:checked')).length;document.getElementById('progress').textContent=n+' of 50 answered';document.getElementById('fill').style.width=n*2+'%'}function score(){let n=0,b={};Q.forEach((x,i)=>{b[x.c]??={s:0};let v=document.querySelector('input[name=q'+i+']:checked');if(v&&+v.value===x.a){n++;b[x.c].s++}});let t='SHERLOCK AI BENCHMARK v1.0\nTotal: '+n+'/50 ('+n*2+'%)\n';Object.keys(b).forEach(c=>t+='\n'+c+': '+b[c].s+'/10 ('+b[c].s*10+'%)');t+='\n\nFixed multiple-choice score; limited evaluation measure.';document.getElementById('result').innerHTML='<h2>'+n+'/50 · '+n*2+'%</h2>'+Object.keys(b).map(c=>'<p>'+c+': '+b[c].s+'/10</p>').join('');document.getElementById('report').value=t;window.rt=t}function copy(){if(!window.rt)score();let a=document.getElementById('report');a.select();document.execCommand('copy')}function reset(){document.querySelectorAll('input').forEach(x=>x.checked=false);document.getElementById('result').innerHTML='';document.getElementById('report').value='';window.rt='';prog()}</script></body></html>
